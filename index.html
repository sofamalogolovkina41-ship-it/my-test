<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по базам данных</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Тестирование знаний</h1>
        <div id="quiz-container">
            <p id="question-text">Загрузка вопросов...</p>
            <div id="options-container"></div>
            <button id="next-btn" style="display: none;">Следующий вопрос</button>
            <p id="progress"></p>
        </div>
        <div id="result-container" style="display: none;">
            <h2>Тест завершен!</h2>
            <p id="score"></p>
            <button onclick="location.reload()">Пройти заново</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
